{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Utensil Store</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body style="font-family: Arial, sans-serif; margin:0; padding:0;">

<header style="background:#333; color:white; padding:15px; text-align:center;">
    <h2>🍴 Utensil Store</h2>
</header>

<section style="padding:40px; max-width:600px; margin:0 auto;">
    <h1>Contact Us</h1>
    <p>If you have any questions, feel free to reach out to us.</p>

     {% if success %}
        <div style="background:#e6ffe6; border:1px solid #5cb85c; padding:15px; border-radius:5px; margin-bottom:20px; color:green; text-align:center;">
            ✅ Thank you for contacting us! We’ll get back to you soon.
        </div>
    {% endif %}

    <form method="post" action="">
        {% csrf_token %}
        <div style="margin-bottom:15px;">
            <label>Name:</label><br>
            <input type="text" name="name" required style="width:100%; padding:8px;">
        </div>
        <div style="margin-bottom:15px;">
            <label>Email:</label><br>
            <input type="email" name="email" required style="width:100%; padding:8px;">
        </div>
        <div style="margin-bottom:15px;">
            <label>Message:</label><br>
            <textarea name="message" rows="5" required style="width:100%; padding:8px;"></textarea>
        </div>
        <button type="submit" style="background:#333; color:white; padding:10px 20px; border:none; cursor:pointer;">
            Send
        </button>
    </form>
</section>

<footer style="background:#333; color:white; text-align:center; padding:20px; margin-top:30px;">
    <p>&copy; 2025 Utensil Store. All Rights Reserved.</p>
</footer>

</body>
</html>
