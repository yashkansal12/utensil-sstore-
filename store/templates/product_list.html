{% comment %} <form method="get" class="mb-3">
    <!-- Search -->
    <input type="text" name="search" placeholder="Search product..." value="{{ request.GET.search }}">

    <!-- Filter Dropdown -->
    <select name="category">
        <option value="">All Categories</option>
        <option value="Plate" {% if request.GET.category == "Plate" %}selected{% endif %}>Plate</option>
        <option value="Bowl" {% if request.GET.category == "Bowl" %}selected{% endif %}>Bowl</option>
        <option value="Spoon" {% if request.GET.category == "Spoon" %}selected{% endif %}>Spoon</option>
        <option value="Spatula" {% if request.GET.category == "Spatula" %}selected{% endif %}>Spatula</option>
    </select>

    <button type="submit">Apply</button>
</form>

<!-- Product List -->
<ul>
    {% for utensil in utensils %}
        <li>{{ utensil.name }} - {{ utensil.category }} - ₹{{ utensil.price }}</li>
    {% empty %}
        <li>No products found.</li>
    {% endfor %}
</ul> {% endcomment %}
