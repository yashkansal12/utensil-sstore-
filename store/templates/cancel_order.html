{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cancel Order - Utensil Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<header class="bg-dark text-white text-center py-3">
    <h2>🍴 Utensil Store</h2>
</header>

<section class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-lg border-0">
                <div class="card-body text-center p-4">
                    <h3 class="mb-4 text-danger">Cancel Order</h3>
                    <p>Are you sure you want to cancel this order?</p>
                    <p><strong>Order ID:</strong> {{ order.id }}</p>
                    <p><strong>Address:</strong> {{ order.address }}</p>
                    <p><strong>Phone:</strong> {{ order.phone }}</p>

                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger w-100 my-2">❌ Yes, Cancel Order</button>
                        <a href="{% url 'my_orders' %}" class="btn btn-secondary w-100 my-2">⬅️ Go Back</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>

<footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Utensil Store. All Rights Reserved.</p>
</footer>

</body>
</html>
